# Push a tag like v0.3.0 (npm run release does it) -> builds the installer -> publishes a GitHub Release.
# Installed PAPyrus apps check that release and show the update notification.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Build only. electron-builder's own GitHub publisher uploads the files in parallel tasks that
      # race to create the release: one fails (422 already_exists) or the run ends early, and the
      # release ends up without the installer or latest.yml (auto-update then gets a 404).
      - run: npx electron-builder --config electron-builder.config.cjs --win --publish never
      # One release with all three files; re-running the job replaces them.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:TAG.TrimStart('v')
          # fixed name (no version): https://github.com/<repo>/releases/latest/download/PAPyrus-Setup.exe is always the newest
          $files = @("release/PAPyrus-Setup.exe", "release/PAPyrus-Setup.exe.blockmap", "release/latest.yml")
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "missing build output: $f" } }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title $version --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
          $names = gh release view $env:TAG --json assets --jq '.assets[].name'
          foreach ($f in $files) { if ($names -notcontains (Split-Path $f -Leaf)) { throw "not uploaded: $f" } }
          Write-Host "published $env:TAG with: $($names -join ', ')"
